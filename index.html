<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a211d;--card:#362a25;--tx:#fbeee3;--mut:#c4a999;--bd:#4d3b33}}
:root[data-theme="dark"]{--bg:#2a211d;--card:#362a25;--tx:#fbeee3;--mut:#c4a999;--bd:#4d3b33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,ui-rounded,system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0}h2{font-size:17px;margin:18px 0 6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--bd)}
.kid{cursor:pointer;text-align:center}.av{font-size:48px}.nm{font-weight:800;font-size:19px}.mut{color:var(--mut);font-size:14px}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--sun))}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
input,select{font:inherit;padding:9px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);min-width:0}
.badge{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:6px 10px;font-size:13px}.badge.off{opacity:.3;filter:grayscale(1)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.pos{color:var(--good);font-weight:800}.neg{color:var(--bad);font-weight:800}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.tabs button{background:var(--card);color:var(--tx);border:2px solid var(--bd)}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}

else if(a==="did"){var x=todays(kidOf(k)).filter(function(y){return y.c.id===v})[0];if(x&&!x.st){if(V.mode==="parent"){go(db.doc("done/"+x.id).set({st:"approved",chore:v,kid:k}).then(function(){return give(k,x.c.pts,x.c.title,"chore")}))}else go(db.doc("done/"+x.id).set({st:"pending",chore:v,kid:k}))}}
else if(a==="ok"){var d=D.done.filter(function(y){return y.id===v})[0],ch=d&&D.chores.filter(function(c){return c.id===d.chore})[0];if(ch)go(db.doc("done/"+v).update({st:"approved"}).then(function(){return give(d.kid,ch.pts,ch.title,"chore")}))}
else if(a==="no"){go(db.doc("done/"+v).delete())}
else if(a==="buy"){var rw=D.rewards.filter(function(y){return y.id===v})[0];if(rw&&tot(k)>=rw.cost&&confirm("Get "+rw.title+" for "+rw.cost+" stars?"))go(give(k,-rw.cost,"🎁 "+rw.title,"reward"))}
else if(a==="win"){var W=WINS[parseInt(el.dataset.i)];if(W&&confirm("Add '"+W[1]+"' (+"+W[2]+" stars)?"))go(addWin(k,W[0],W[1],W[2]))}
else if(a==="addwin"){var wt=document.getElementById("wt").value.trim();if(wt)go(addWin(k,document.getElementById("wem").value.trim()||"🏆",wt,Math.max(0,parseInt(document.getElementById("wb").value)||0)))}
else if(a==="delwin"){go(db.doc("wins/"+v).delete())}
else if(a==="give"){go(give(k,parseInt(el.dataset.p),el.dataset.w,el.dataset.c))}
else if(a==="cust"){var w=document.getElementById("cw").value.trim();if(w)go(give(k,parseInt(v)*Math.abs(parseInt(document.getElementById("cn").value)||1),w))}
render()});
var ME=null,LAST="";
function api(m,u,b){return fetch(u,{method:m,credentials:"same-origin",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j;return j})})}
function poll(force){if(!ME)return Promise.resolve();return api("GET","/api/all").then(function(a){var x=JSON.stringify(a);if(x===LAST&&!force)return;LAST=x;for(var c in a)D[c]=a[c];var ae=document.activeElement;if(force||!ae||!/INPUT|SELECT|TEXTAREA/.test(ae.tagName))render()}).catch(function(e){if(e&&e.e==="auth"){ME=null;db=null;render()}})}
function mkdb(){return{collection:function(c){return{add:function(d){return api("POST","/api/c/"+c,d).then(function(){return poll(true)})}}},doc:function(p){var a=p.split("/"),u="/api/c/"+a[0]+"/"+a[1];function w(m,d){return api(m,u,d).then(function(){return poll(true)})}return{set:function(d){return w("PUT",d)},update:function(d){return w("PATCH",d)},delete:function(){return w("DELETE")}}}}}
function start(u){ME=u;db=mkdb();LAST="";poll(true)}
function authScreen(){var m=V.auth,t="";[["login","Sign in"],["new","Create a family"],["join","Join with a code"]].forEach(function(x){t+="<button class='"+(m===x[0]?"on":"")+"' data-a='am' data-v='"+x[0]+"'>"+x[1]+"</button>"});
return "<div class='top'><h1>🏡 Home Dojo</h1></div><p class='mut'>Cheer on your kids, one star at a time. 💛</p><div class='card' style='max-width:440px;margin:18px auto'><div class='tabs'>"+t+"</div><div class='row' style='flex-direction:column;align-items:stretch'>"+(m!=="login"?"<input id='an' placeholder='Your name'>":"")+(m==="new"?"<input id='af' placeholder='Family name (e.g. The Okafors)'>":"")+(m==="join"?"<input id='ac' placeholder='Invite code from your partner'>":"")+"<input id='ae' type='email' placeholder='Email'><input id='ap' type='password' placeholder='Password (8+ characters)'><button data-a='auth'>"+(m==="login"?"Sign in":m==="new"?"Create my family 🏡":"Join family 💛")+"</button><div id='aerr' class='neg'></div></div></div>"}
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;var a=el.dataset.a;
if(a==="logout"){e.preventDefault();api("POST","/api/logout").then(function(){ME=null;db=null;D={kids:[],chores:[],rewards:[],events:[],done:[],wins:[]};V.sel=null;render()})}
else if(a==="am"){V.auth=el.dataset.v;render()}
else if(a==="auth"){var g=function(i){var x=document.getElementById(i);return x?x.value.trim():""};api("POST",V.auth==="login"?"/api/login":"/api/register",{mode:V.auth,name:g("an"),family:g("af"),code:g("ac"),email:g("ae"),password:document.getElementById("ap").value}).then(start).catch(function(x){document.getElementById("aerr").textContent=(x&&x.e)||"Something went wrong"})}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&!ME&&/INPUT/.test(e.target.tagName)){var b=document.querySelector("[data-a=auth]");if(b)b.click()}});
function wkR(o){var a=new Date();a.setHours(0,0,0,0);a.setDate(a.getDate()-((a.getDay()+6)%7)-7*o);var b=new Date(a);b.setDate(b.getDate()+7);return[a.getTime(),b.getTime()]}
function wsum(id,o){var r=wkR(o),es=ev(id).filter(function(e){return e.t>=r[0]&&e.t<r[1]}),s={earn:0,lost:0,spent:0,chores:0,top:"",wins:D.wins.filter(function(w){return w.kid===id&&w.t>=r[0]&&w.t<r[1]}).length},cnt={},m=0,w;
es.forEach(function(e){if(e.p>0){s.earn+=e.p;if(e.c==="chore")s.chores++;cnt[e.w]=(cnt[e.w]||0)+1}else if(e.c==="reward")s.spent-=e.p;else s.lost-=e.p});
for(w in cnt)if(cnt[w]>m){m=cnt[w];s.top=w}return s}
function wcard(x,o){var s=wsum(x.id,o),msg=!s.earn&&!s.lost?"A quiet week 🌙":!s.lost?"A perfect week! 🌟":s.earn>=s.lost?"Great effort — keep it going! 💪":"A tricky week — tomorrow is a fresh start 🌈";
return "<div class='card'><div class='nm'>"+esc(x.av)+" "+esc(x.name)+"</div><div class='row'><span class='pos'>+"+s.earn+" ⭐ earned</span><span class='neg'>−"+s.lost+" lost</span><span class='mut'>🎁 "+s.spent+" spent</span></div><div class='mut'>🧹 "+s.chores+" chores · 🏆 "+s.wins+" achievements"+(s.top?" · Most often: "+esc(s.top):"")+"</div><div style='margin-top:6px'><b>"+msg+"</b></div></div>"}
function weeklyAll(){var h="<h2>📅 Weekly summary</h2><div class='tabs'>";[["This week",0],["Last week",1],["2 weeks ago",2],["3 weeks ago",3]].forEach(function(t){h+="<button class='"+(V.wk===t[1]?"on":"")+"' data-a='wk' data-v='"+t[1]+"'>"+t[0]+"</button>"});
h+="</div><div class='mut'>Week of "+new Date(wkR(V.wk)[0]).toLocaleDateString(undefined,{month:"short",day:"numeric"})+"</div><div class='grid' style='margin-top:10px'>";D.kids.forEach(function(x){h+=wcard(x,V.wk)});return h+"</div>"+(D.kids.length?"":"<p class='mut'>Add a child to see their week.</p>")}
function weeklyKid(k){return "<h2>📅 My week</h2>"+wcard(k,0)}
setInterval(function(){if(!document.hidden)poll()},5000);
api("GET","/api/me").then(start).catch(function(){render()});
